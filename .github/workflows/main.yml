name: Deploy to EC2

on:
  push:
    branches: [ development ]  # Change this to your main branch name
  workflow_dispatch:    # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'  # Adjust based on your Spring Boot version
        distribution: 'temurin'
        cache: gradle
        
    - name: Build with Gradle
      run: ./gradlew build -x test
      
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
    # Create .env file from GitHub secret
    - name: Create .env file
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env
        echo ".env file created from GitHub secret"
      
    - name: Transfer files to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT }}
        source: "docker-compose.yml,Dockerfile,.env,build/libs/*.jar"
        target: "~/app"
        strip_components: 0
        
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT }}
        script: |
          cd ~/app
          
          # Stop and remove existing containers
          docker-compose down
          
          # Pull latest changes and rebuild
          docker-compose up -d --build
          
          # Clean up unused images and volumes
          docker system prune -f
