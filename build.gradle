plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.25.0'
}

// Project metadata
group = 'com.paperlink'
version = '0.1.0'

// Dependency versions
ext {
    springAiVersion = '1.0.0-M6'
    awsSdkVersion = '2.21.1'
    openApiVersion = '2.8.5'
    jwtVersion = '0.12.6'
    awsSpringCloudVersion = '3.0.3'
    modelMapperVersion = '3.2.2'
    slackSdk = '1.45.3'
}

// Java configuration
java {
    sourceCompatibility = '17'
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Repository configuration
repositories {
    mavenCentral()
}

// Spotless configuration
spotless {
    java {
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Dependencies grouped by purpose
dependencies {
    // Spring Boot core
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Spring AI
    implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'
    implementation 'org.springframework.ai:spring-ai-pgvector-store-spring-boot-starter'
    implementation 'org.springframework.ai:spring-ai-pdf-document-reader'

    // AWS
    implementation "io.awspring.cloud:spring-cloud-aws-starter:${awsSpringCloudVersion}"
    implementation "io.awspring.cloud:spring-cloud-aws-starter-s3:${awsSpringCloudVersion}"
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:lambda'

    // Resiliency
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // Documentation
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openApiVersion}"

    // Authentication
    implementation "io.jsonwebtoken:jjwt:${jwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jwtVersion}"

    // Utilities
    implementation "org.modelmapper:modelmapper:${modelMapperVersion}"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Slack API SDK
    implementation "com.slack.api:slack-api-client:${slackSdk}"
    implementation "com.slack.api:slack-app-backend:${slackSdk}"

    // Thymeleaf for HTML templates
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // Development tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    developmentOnly 'org.springframework.ai:spring-ai-spring-boot-docker-compose'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'com.h2database:h2'
}

// Spring AI BOM
dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

// Test configuration
test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// JaCoCo configuration
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Spring Boot build info
springBoot {
    buildInfo()
}