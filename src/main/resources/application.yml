# Common configurations
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

spring:
  # Application name and profiles
  application:
    name: paperlink-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:paperlink}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 20000

  # Thymeleaf configuration
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
    prefix: classpath:/templates/
    suffix: .html

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: ${JPA_SHOW_SQL:false}

  # AI configuration
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: 'text-embedding-3-small'
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: ${OPENAI_TEMPERATURE:0.7}
          max-tokens: ${OPENAI_MAX_TOKENS:4096}

  # Multipart file configuration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
      enabled: true

  # AWS configuration
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-south-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY:}
        secret-key: ${AWS_SECRET_KEY:}

  # Cache configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=1h

  # Async executor configuration
  task:
    execution:
      pool:
        core-size: ${ASYNC_CORE_POOL_SIZE:2}
        max-size: ${ASYNC_MAX_POOL_SIZE:5}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
      thread-name-prefix: paperlink-async-

# JWT configuration
jwt:
  secretKey: ${JWT_SECRET_KEY:defaultSecretKeyForDevelopmentOnlyChangeInProduction}
  accessToken:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:300000}  # 5 minutes
  refreshToken:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}  # 30 days

# Application-specific configuration
paperlink:
  s3:
    bucket-name: ${S3_BUCKET_NAME:paperaitest}
  ai:
    system-prompt: ${AI_SYSTEM_PROMPT:You are a helpful assistant for PaperLink. Use the provided documents to answer questions accurately.}
    chat-history-limit: ${CHAT_HISTORY_LIMIT:20}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Requested-With
  processing:
    max-retry-attempts: ${MAX_PROCESSING_RETRY_ATTEMPTS:3}
    chunk-size: ${CHUNK_SIZE:1000}
    similarity-threshold: ${SIMILARITY_THRESHOLD:0.7}
    max-concurrent-uploads: ${MAX_CONCURRENT_UPLOADS:10}
    document-parser-lambda: ${DOCUMENT_PARSER_LAMBDA:paperlink-document-parser}

# Slack integration configuration
slack:
  client:
    id: ${SLACK_CLIENT_ID:}
    secret: ${SLACK_CLIENT_SECRET:}
  redirect:
    uri: ${SLACK_REDIRECT_URI:https://your-domain.com/api/v1/slack/oauth/callback}
  signing:
    secret: ${SLACK_SIGNING_SECRET:}
  verification:
    token: ${SLACK_VERIFICATION_TOKEN:}

# API documentation configuration
springdoc:
  packages-to-scan: com.paperlink.server
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  paths-to-match: /v1/**

# Actuator configuration for health monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    diskspace:
      enabled: true
  info:
    env:
      enabled: true

# Logging configuration
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springdoc: ${DOC_LOG_LEVEL:INFO}
    com.paperlink: ${APP_LOG_LEVEL:INFO}
    org.springframework.ai: ${AI_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:/app/logs/paperlink.log}