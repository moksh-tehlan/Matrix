  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: ${POSTGRES_CONTAINER_NAME:-paperlink_postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-paperlink}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  app_logs:
    name: ${APP_LOGS_VOLUME_NAME:-app_logs}
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}

networks:
  app_network:
    name: ${NETWORK_NAME:-app_network}
    driver: bridge