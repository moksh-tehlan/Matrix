version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-paperlink_app}
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-paperlink}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SERVER_PORT=8080
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-300000}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-2592000000}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-paperaitest}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-4096}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - AI_LOG_LEVEL=${AI_LOG_LEVEL:-INFO}
      - DOC_LOG_LEVEL=${DOC_LOG_LEVEL:-INFO}
      - SECURITY_LOG_LEVEL=${SECURITY_LOG_LEVEL:-INFO}
      - JPA_SHOW_SQL=${JPA_SHOW_SQL:-false}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-update}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-20MB}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-20MB}
      - ASYNC_CORE_POOL_SIZE=${ASYNC_CORE_POOL_SIZE:-2}
      - ASYNC_MAX_POOL_SIZE=${ASYNC_MAX_POOL_SIZE:-5}
      - ASYNC_QUEUE_CAPACITY=${ASYNC_QUEUE_CAPACITY:-100}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - AI_SYSTEM_PROMPT=${AI_SYSTEM_PROMPT:-You are a helpful assistant for PaperLink. Use the provided documents to answer questions accurately.}
      - CHAT_HISTORY_LIMIT=${CHAT_HISTORY_LIMIT:-20}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}
      - SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_VERIFICATION_TOKEN=${SLACK_VERIFICATION_TOKEN}
      - MAX_PROCESSING_RETRY_ATTEMPTS=${MAX_PROCESSING_RETRY_ATTEMPTS:-3}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.7}
      - MAX_CONCURRENT_UPLOADS=${MAX_CONCURRENT_UPLOADS:-10}
      - DOCUMENT_PARSER_LAMBDA=${DOCUMENT_PARSER_LAMBDA:-paperlink-document-parser}
    volumes:
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: ${POSTGRES_CONTAINER_NAME:-paperlink_postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-paperlink}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  app_logs:
    name: ${APP_LOGS_VOLUME_NAME:-app_logs}
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}

networks:
  app_network:
    name: ${NETWORK_NAME:-app_network}
    driver: bridge